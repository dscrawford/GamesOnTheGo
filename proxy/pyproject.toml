[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gotg-proxy"
version = "0.3.0"
description = "The GOTG service: holds the artwork API credentials and the saves"
requires-python = ">=3.11"
# Deliberately none. A few hundred requests a week from a handful of machines
# does not need a framework, and a service whose whole job is holding secrets
# is a poor place to take on a supply chain. This is also why there is no
# uv.lock here as there is for the importer: uv2nix exists to reproduce a
# dependency set, and there is nothing to reproduce.
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gotg-proxy = "gotg_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gotg_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
