# Which drawing stands for a controller, by what it calls itself.
#
# A pad reports whatever its maker wrote -- "Xbox 360 Controller" and
# "Microsoft X-Box 360 pad" are one icon -- so these are substrings of the
# lowercased name, and the *first* one that matches wins.
#
# Order is the whole of it. Steam's virtual pad reports as an Xbox pad wearing
# a different hat, so "steam virtual" has to be tried before "steam"; "nes "
# has a trailing space so it cannot swallow "genesis"; the Puck says "Valve
# Software Steam Controller Puck" and matches "steam controller" before it
# ever reaches "valve".
#
# Some pads no name can tell apart. `ids` is tried first, by exact
# vendor:product in lowercase hex, read from /proc/bus/input/devices for the
# node padmap seated (`gotg_ui/devices.py`).

fallback: generic

# Checked before the names. A Steam Deck reports N: Name="Valve Software Steam
# Controller", character for character what a Steam Controller reports, so
# nothing but the product id can give it the handheld drawing -- which is the
# shape the person is actually holding. 1102 and 1142 are the wired and
# wireless Steam Controllers, 1304 the Puck; those already reach "steam" by
# name and are left to.
ids:
  - "28de:1205":          steamdeck

rules:
  - "steam virtual":      xbox
  - "steam controller":   steam
  - "steam deck":         steamdeck   # Steam Input names a Deck this; the hardware does not
  - "valve":              steam
  - "gamecube":           gamecube
  - "nintendo gamecube":  gamecube
  - "wii u":              generic
  - "wii remote":         wii
  - "wiimote":            wii
  - "joy-con":            switch
  - "joycon":             switch
  - "switch pro":         switch
  - "nintendo switch":    switch
  - "nintendo 64":        n64
  - "n64":                n64
  - "super nintendo":     snes
  - "snes":               snes
  - "famicom":            nes
  - "nes ":               nes
  - "mega drive":         megadrive
  - "megadrive":          megadrive
  - "genesis":            megadrive
  - "game boy advance":   gba
  - "gba":                gba
  - "game boy":           gameboy
  - "gameboy":            gameboy
  - "dualshock":          playstation
  - "dualsense":          playstation
  - "playstation":        playstation
  - "ps3":                playstation
  - "ps4":                playstation
  - "ps5":                playstation
  - "keyboard and mouse": keyboard-mouse
  # The keyboard's seat is the whole desk -- some games want the mouse too --
  # and the plain keyboard's silhouette was a featureless rectangle.
  - "keyboard":           keyboard-mouse
  - "mouse":              mouse
  - "xbox":               xbox
  - "x-box":              xbox
  - "x360":               xbox
