# How the picker looks, and how long it is prepared to wait.
#
# One palette. These colours used to live in four modules, and `background` was
# (18, 18, 20) in two of them and (18, 18, 22) in a third -- close enough that
# nobody saw it and different enough to be wrong. The same grey was `TEXT` in
# one file and `LABEL` in another.

colours:
  background: [18, 18, 20]
  panel: [26, 26, 30]
  text: [232, 232, 236]
  text_dim: [150, 150, 158]

  # The grid.
  tile: [38, 38, 44]
  tile_selected: [58, 104, 148]

  # Leader lines on the controller diagram, and the dot where one lands.
  leader: [108, 108, 122]
  leader_lit: [120, 180, 240]
  dot: [150, 150, 162]

  # An empty seat, or a controller not plugged in: grey. It was red, on the
  # theory that a seat nobody is in is something to do -- but a room of four
  # seats with one player in it is not three problems, and red everywhere
  # read as broken. The silhouette under a pad being revealed is `empty`.
  empty: [52, 52, 58]
  empty_ring: [120, 120, 128]
  empty_text: [150, 150, 158]

  # What still needs somebody to act: the launch gate's message and the
  # countdown when there is no padmap. Red is kept for these alone.
  attention: [208, 78, 78]

  # A seat that is settled: mapped, published, nothing left to do. Green
  # because it is the one colour in the room that means "done" without a word
  # beside it, and it is drawn over the seat's own colour, never instead of it.
  ready: [108, 196, 116]

# Players 1-4. Nintendo's four-player order, which is what the consoles this
# runs use on their own port lights. A fifth player wraps rather than failing:
# padmap will seat as many as are asked for, and a pad with no colour is worse
# than two pads sharing one.
players:
  - [96, 176, 255]   # 1 blue
  - [240, 96, 96]    # 2 red
  - [120, 216, 120]  # 3 green
  - [248, 208, 88]   # 4 yellow

window: [1280, 800]

# The strip of seats across the top. `height` is what every screen below is
# offset by, so they carry no copy of the number.
strip:
  height: 54
  pad_radius: 14
  gap: 10

# The grid of games.
grid:
  columns: 5
  rows: 2
  tile_aspect: 1.5      # 900x600 box art
  gap_fraction: 0.02
  margin_fraction: 0.04

# The other view: a list down the left, one game per row the way Steam's
# library reads, with the art of the one under the cursor filling the right.
shelf:
  rows: 12
  # How much of the width the list takes; the rest is the art.
  list_fraction: 0.38

# Seconds, everywhere.
# Wait for the panel before showing a frame. On: a reveal filling in and a
# stick dot moving are watched closely, and frames drawn between refreshes are
# a hold that steps rather than moves. The first twenty frames check that the
# wait actually happens (pace.py) -- pygame's plain window accepted this and
# ignored it -- and time the frames themselves if it does not.
# `GOTG_UI_FPS=1` prints what SDL actually gave us.
vsync: true
# Present through an SDL renderer, which is what makes the wait above real in
# a window. Off puts back pygame's own window; so does
# `GOTG_UI_RENDERER=window`, for comparing the two without editing this.
renderer: true

timeouts:
  # A unix socket either answers at once or is not there; this is only so a
  # stale socket file cannot hang a frame.
  padmap_connect: 0.25
  # Long enough for a cold daemon start, short enough that somebody in front
  # of a television is not staring at nothing.
  padmap_daemon: 10
  # A daemon that is running but silent, before a launch gives up on it.
  first_state: 3.0
  # Every hold this program times, and they are all the same length on
  # purpose -- one length means nobody has to learn which is which. A second
  # was short enough that arriving at the door with a thumb on A started the
  # game before the screen had been read; three was long enough to feel like
  # the program had stopped listening. A second and a half, the same length
  # `pair_hold` asks padmap for, so pairing and readying up feel like one
  # gesture repeated.
  seat_go_hold: 1.5
  # The pause between pairing and being allowed to start: every pad quiet for
  # this long. padmap claims a seat after a quarter second and a thumb takes
  # longer than that to come off, so the press that paired a controller used
  # to run straight into the hold that starts the game.
  seat_pause: 1.0
  # How long a button is held to claim a seat. padmap's own default is a
  # quarter second, which is short enough that picking a controller up claims
  # one; this is what `seating` asks for instead. 0.05 to 10 seconds -- padmap
  # ignores anything else and keeps its default.
  pair_hold: 1.5
  seat_rebind_hold: 1.5
  keyboard_hold: 1.5
  service: 10
  ready: 3
