# Nintendo DS. Its buttons are a SNES pad's, so it walks danstick's snes layout;
# the drawing's circles are named after danstick's controls, so no `anchors:`.

label: Nintendo DS

# The danstick layout the capture walks; `controls` is its control set.
layout: snes
# assets/controllers/<artwork>.svg
artwork: nds
players: 1
# The GOTG platforms played with this controller.
platforms: [nds]

# danstick's control id -> what the button says.
controls:
  a: B (bottom)
  b: A (right)
  x: Y (left)
  y: X (top)
  dpup: D-pad up
  dpdown: D-pad down
  dpleft: D-pad left
  dpright: D-pad right
  back: Select
  start: Start
  leftshoulder: L
  rightshoulder: R
