# Gamepad.
#
# The fallback, for a platform no other file claims.

label: Gamepad

# The danstick layout the capture walks; `controls` is its control set.
layout: generic
# assets/controllers/<artwork>.svg
artwork: generic
players: 4
# The GOTG platforms played with this controller.
platforms: []

# danstick's control id -> what the button says.
controls:
  a: A (bottom face)
  b: B (right face)
  x: X (left face)
  y: Y (top face)
  dpup: D-pad up
  dpdown: D-pad down
  dpleft: D-pad left
  dpright: D-pad right
  back: Select
  start: Start
  leftshoulder: Left shoulder
  rightshoulder: Right shoulder
  lefttrigger: Left trigger
  righttrigger: Right trigger
  leftstick_up: Left stick up
  leftstick_down: Left stick down
  leftstick_left: Left stick left
  leftstick_right: Left stick right
  rightstick_up: Right stick up
  rightstick_down: Right stick down
  rightstick_left: Right stick left
  rightstick_right: Right stick right

# Where the drawing marks it, when the circle is not named after the
# control. These drawings predate danstick and use the console's letters.
anchors:
  a: A
  b: B
  x: X
  y: Y
  dpup: Up
  dpdown: Down
  dpleft: Left
  dpright: Right
  back: Select
  start: Start
  leftshoulder: L
  rightshoulder: R
