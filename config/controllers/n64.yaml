# Nintendo 64.
#
# Z is underneath the pad and the drawing is from the front, so it has
# nowhere to point at. It is bound; it just cannot be shown.

label: Nintendo 64

# The padmap layout the capture walks; `controls` is its control set.
layout: n64
# assets/controllers/<artwork>.svg
artwork: n64
players: 4
# What ares calls this console, for the bindings ares writes itself.
ares: [Nintendo64]
# The GOTG platforms played with this controller.
platforms: [n64]

# padmap's control id -> what the button says.
# The stick sits in an octagonal gate -- eight corners you can feel through
# the thumb -- so the ring drawn over it is an octagon too. The C group is
# four buttons and no gate at all; the ring standing in for it is round,
# because drawing eight corners there would be inventing them.
gate:
  left: octagon
  right: circle

controls:
  a: A
  b: B
  start: Start
  dpup: D-pad up
  dpdown: D-pad down
  dpleft: D-pad left
  dpright: D-pad right
  leftshoulder: L (top left)
  rightshoulder: R (top right)
  lefttrigger: Z (underneath)
  rightstick_up: C-up
  rightstick_down: C-down
  rightstick_left: C-left
  rightstick_right: C-right
  leftstick_up: Control stick up
  leftstick_down: Control stick down
  leftstick_left: Control stick left
  leftstick_right: Control stick right

# Where the drawing marks it, when the circle is not named after the
# control. These drawings predate padmap and use the console's letters.
anchors:
  a: A
  b: B
  start: Start
  dpup: Up
  dpdown: Down
  dpleft: Left
  dpright: Right
  leftshoulder: L
  rightshoulder: R
  rightstick_up: C-Up
  rightstick_down: C-Down
  rightstick_left: C-Left
  rightstick_right: C-Right
