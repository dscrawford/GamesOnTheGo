# One QA run, as a Job. Templated by substitution rather than by a chart:
# @GAME@, @NAME@ and the tier fields are what change between runs, and a
# dispatcher that renders this file is easier to read than a chart that hides
# it. See README.md for what to substitute.
#
#   sed -e 's/@NAME@/usa-diddy-kong-racing/' -e 's/@GAME@/usa.diddy_kong_racing_rev1/' \
#       k8s/qa/job.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: gotg-qa-@NAME@
  namespace: default
spec:
  # A QA verdict is a measurement, and a retried measurement that disagrees
  # with the first is the interesting case, not one to paper over. Failures
  # stay failed and keep their artifacts.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # The GPU tier. node3 is where the card is, and asking for one of its
      # slices is the whole of it: this cluster injects the driver through CDI
      # (containerd's enable_cdi, fed by generic-cdi-plugin), so there is no
      # nvidia runtime class to name — naming one wedges the pod on "no
      # runtime for nvidia is configured", which is how this comment was
      # written. Without the slice the pod still runs, on the image's llvmpipe,
      # and would quietly grade a software renderer as the real one.
      #
      # For the CPU tier (8/16-bit under llvmpipe) drop the nodeSelector and
      # the nvidia.com/gpu-0 limit, and let it schedule anywhere.
      nodeSelector:
        kubernetes.io/hostname: node3
      containers:
        - name: qa
          image: localhost:30500/gotg-qa:0.5.8
          args: ["@GAME@", "--duration", "60", "--boot-wait", "25"]
          resources:
            limits:
              # One time-slice of the card. node3 advertises two, so a run can
              # share with the transcoder — there is no memory isolation
              # between slices, which retro emulators can afford and a sweep of
              # heavier ones could not.
              nvidia.com/gpu-0: 1
              # A Switch title under Ryujinx holds 8-10 GiB of host memory
              # once its guest heap is mapped; the cartridge platforms need a
              # fraction of this and do not mind the headroom.
              memory: 16Gi
            requests:
              cpu: "4"
              memory: 4Gi
          env:
            - name: GOTG_GAMES_DIR
              value: /state/games
            # The bytes come from the library service next door, not from the
            # VPN-fronted host the catalog names for the outside world — and
            # when the library volume is mounted below, straight from it.
            - name: GOTG_FILES_URL
              value: http://gotg-library.default.svc
            - name: GOTG_LIBRARY_MOUNT
              value: /data
          securityContext:
            # /dev/uinput is the virtual pad, and containerd's device cgroup
            # denies it to an unprivileged container however the node's file
            # permissions read. This is the one thing in the stack that wants
            # privilege, and it is why QA runs on a private cluster.
            privileged: true
          volumeMounts:
            - name: state
              mountPath: /state
            # Staged, not used in place: the entrypoint copies these to
            # ~/.config/gotg so the token file can be mode 600, which a
            # secret's symlinks can never be.
            - name: config
              mountPath: /run/gotg-config
              readOnly: true
            - name: uinput
              mountPath: /dev/uinput
            - name: input
              mountPath: /dev/input
              # The pad is created through /dev/uinput; this mount is only how
              # SDL enumerates it. Read-only keeps the pod off the host's
              # keystrokes, and keeps that intent recorded if the privileged
              # flag above is ever narrowed to a device plugin.
              readOnly: true
            # Big enough for a run's capture before it is written out — the
            # default 64M would truncate a minute of lossless video — and for
            # an emulator's guest memory, which .NET backs with shared memory.
            - name: shm
              mountPath: /dev/shm
            # The library itself, read-only, at the path the catalog names.
            # With it, members are copied rather than streamed; the pod's
            # token has to be the library one for the catalog to say where.
            - name: library
              mountPath: /data
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: gotg-qa-state
        - name: config
          secret:
            secretName: gotg-qa-config
            # api.json holds the service token, and the client checks the mode
            # before it trusts a file that does — the projected default is
            # world-readable and draws a warning on every run.
            defaultMode: 0600
        - name: uinput
          hostPath:
            path: /dev/uinput
            type: CharDevice
        - name: input
          hostPath:
            path: /dev/input
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            # Ryujinx backs guest memory with shared memory too, and a Switch
            # title maps several GiB of it; counted against the pod's limit.
            sizeLimit: 8Gi
        - name: library
          persistentVolumeClaim:
            claimName: jellyfin-data
            readOnly: true
