# Classification rules for the GOTG importer. These entries extend/override the
# built-in defaults in plan.py.
#
# It ships *inside the image*, beside the module (rules.py: DEFAULT_RULES_FILE =
# Path(__file__).with_name("rules.yaml")), and the deployed CronJob mounts no
# ConfigMap — only /data and /state. So a change here needs an image build, a
# push, and a CronJob image update before the cluster sees it. Editing this file
# alone changes nothing that is running.
version: 1

# How many mapped ROM files make a directory a "set" rather than a loose game.
min_set_files: 5

# Scene releases carry no region tag in the filename, so they default to `world`
# and are flagged for confirmation. Pin a region for a known release with a
# substring match:
scene_default_region: world
scene_overrides: []
#   - match: "NSW-VENOM"
#     region: usa

# No-Intro / Redump DAT directory name -> platform + handler.
# handler: no_intro_set | single_file | excluded
dat_dirs:
  "Nintendo - Nintendo 64 (BigEndian)":
    platform: n64
    handler: no_intro_set
  "Nintendo - Super Nintendo Entertainment System":
    platform: snes
    handler: no_intro_set
  "Nintendo - Game Boy":
    platform: gb
    handler: no_intro_set
  # 3500 games sat behind the "unmapped" warning until the 2026-08-21 import was
  # read. env/gba.nix already existed, so this was only ever the missing name.
  "Nintendo - Game Boy Advance":
    platform: gba
    handler: no_intro_set
  # The retail set. Matched by exact name, so the (Aftermarket) set below —
  # homebrew and unlicensed carts — stays excluded on its own line.
  "Nintendo - Nintendo Entertainment System (Headered)":
    platform: nes
    handler: no_intro_set
  # Homebrew/aftermarket set — deliberately not imported (decision 2026-07-26).
  "Nintendo - Nintendo Entertainment System (Headered) (Aftermarket)":
    platform: nes
    handler: excluded
  # No-Intro names the one set for both regions, which is why the slug has to
  # pick a side; `genesis` reads better in an id than `megadrive`. The console
  # itself is a Mega Drive everywhere it matters — that is the name ares takes
  # and the name it files saves under (see env/genesis.nix).
  "Sega - Mega Drive - Genesis":
    platform: genesis
    handler: no_intro_set
  # A Redump set, one .7z per disc — 682 of them on 2026-09-05, which the
  # importer walked past for four days as "no recognizable game payload".
  # archive_set: each archive is its own single_archive entry, chosen 1G1R,
  # and the client converts it to RVZ on install.
  "Nintendo - GameCube":
    platform: gamecube
    handler: archive_set

# Single-file extension -> platform, for loose ROM torrents.
extensions:
  # `.iso` is genuinely ambiguous — GameCube, Wii, PS2 and PSP all use it — so it
  # is mapped here rather than in the code defaults, where the assumption would
  # be invisible. This library holds no Wii or PS2 titles; when one arrives this
  # mapping must go and the platform be decided from the disc header instead
  # (dolphin-tool reports the Game ID, which distinguishes them).
  iso: gamecube
  z64: n64
  n64: n64
  v64: n64
  sfc: snes
  smc: snes
  nes: nes
  nsp: switch
  xci: switch
  rvz: gamecube
  gcm: gamecube
  iso: gamecube
  wbfs: wii
  wua: wiiu
  wux: wiiu
  gba: gba
  gbc: gbc
  gb: gb
  # ares' mia opens {md, gen, bin} for the Mega Drive. `.bin` is left out on
  # purpose: it is also a raw CD track on the Saturn, the PlayStation and the
  # Mega CD itself, so mapping it here would file a disc image as a cartridge.
  # A loose `.bin` stays unmapped and gets flagged for a human, which is the
  # right outcome until a disc platform exists to claim it.
  md: genesis
  gen: genesis

# The format each platform's emulator wants (IMPORTER_SPEC.md §5a). A platform
# absent here is imported as it arrives, which is every platform so far.
targets:
  # Dolphin reads NKit images directly and rewraps them as RVZ, which is both
  # smaller and already mapped to gamecube in the extension table. Note the
  # conversion repackages without restoring NKit's stripped data: the result
  # plays correctly but is not a pristine dump.
  gamecube: { ext: rvz, tool: dolphin-tool }
  wii: { ext: rvz, tool: dolphin-tool }
